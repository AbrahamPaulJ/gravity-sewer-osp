<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sewer Growth and Sensor Placement</title>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<style>
:root{
  --bg:#f4f1ea; --panel:#fbf9f4; --ink:#1f2328; --dim:#555b63;
  --line:#ddd6c8; --accent:#2f7fd1; --warn:#e0312b; --amber:#e8912d;
  --green:#1f6f3f; --side:330px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg); color:var(--ink);
  font:14px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;
  display:grid; grid-template-columns:var(--side) 6px 1fr; height:100vh; overflow:hidden}
aside{border-right:1px solid var(--line); background:var(--panel); padding:15px; overflow-y:auto}
#grip{cursor:col-resize; position:relative}
#grip::after{content:""; position:absolute; inset:0 2px; background:var(--line); border-radius:2px}
#grip:hover::after,#grip.on::after{background:var(--accent)}
body.dragging{cursor:col-resize; user-select:none}
h1{font-size:15px; margin:0 0 3px}
.sub{color:var(--dim); font-size:12px; margin:0 0 14px}
.fld{display:block; margin:14px 0 5px; font-size:11px; color:var(--dim);
  text-transform:uppercase; letter-spacing:.05em}
select{width:100%; padding:7px; font:inherit; border:1px solid var(--line);
  border-radius:7px; background:#fff}
.fact{display:flex; justify-content:space-between; gap:10px; padding:5px 0;
  border-bottom:1px solid #eee7da; font-size:12.5px}
.fact span:first-child{color:var(--dim)}
.fact b.bad{color:var(--warn)}
h4{margin:14px 0 5px; font-size:11px; text-transform:uppercase; letter-spacing:.05em;
  color:var(--dim)}
#tipList ul{margin:0; padding-left:18px; font-size:12.5px; columns:2; column-gap:14px}
#tipList li{margin-bottom:2px}
.quiet{color:var(--dim); font-size:12px; margin:4px 0}
#baseNote{margin-top:12px; padding:9px 10px; border-radius:7px; background:#fdf0dc;
  border:1px solid var(--amber); font-size:11.5px; line-height:1.45}
#sensorList{margin-top:14px; padding:11px; border:1px solid var(--line); border-radius:8px;
  background:#fff; font-size:12.5px}
#sensorList p{margin:0 0 8px}
#sensorList ol{margin:0 0 8px; padding-left:20px}
#sensorList table{width:100%; border-collapse:collapse; font-size:12px}
#sensorList td{padding:2px 0; border-top:1px solid #eee7da}
#sensorList td:last-child{text-align:right; color:var(--dim)}
main{display:flex; flex-direction:column; min-width:0; overflow:hidden}
nav{display:flex; gap:5px; align-items:center; padding:8px 13px;
  border-bottom:1px solid var(--line); background:var(--panel)}
nav button{font:inherit; padding:6px 13px; border:1px solid var(--line); background:#fff;
  border-radius:6px; cursor:pointer; color:inherit}
nav button.primary{background:var(--accent); border-color:var(--accent); color:#fff}
nav button.info{margin-left:auto; border-color:var(--accent); color:var(--accent); font-weight:600}
nav button.info:hover{background:var(--accent); color:#fff}
#stage{flex:1; min-height:0; position:relative}
#stage canvas{display:block; width:100%; height:100%}
.labels{position:absolute; inset:0; pointer-events:none}
.legend{padding:8px 14px; border-top:1px solid var(--line); background:var(--panel);
  font-size:11.5px; color:var(--dim); display:flex; gap:16px; flex-wrap:wrap; align-items:center}
.legend .k{display:inline-block; width:10px; height:10px; border-radius:50%;
  vertical-align:-1px; margin-right:5px}
#scale{padding:5px 14px 9px; font-size:10.5px; color:var(--dim);
  border-top:1px solid var(--line); background:var(--panel)}
#modal{position:fixed; inset:0; background:rgba(31,35,40,.45); display:flex;
  align-items:center; justify-content:center; padding:24px; z-index:50}
#modal[hidden]{display:none}
#modal .box{background:var(--panel); border-radius:12px; max-width:780px; width:100%;
  max-height:88vh; overflow-y:auto; padding:26px 30px; box-shadow:0 12px 40px rgba(0,0,0,.25)}
#modal h2{margin:0 0 4px; font-size:19px}
#modal .q{color:var(--accent); font-size:14px; margin:0 0 16px; font-weight:600}
#modal h3{font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--dim);
  margin:20px 0 7px}
#modal p{margin:0 0 10px}
#modal ul,#modal ol{margin:0 0 10px; padding-left:20px}
#modal li{margin-bottom:5px}
.kfacts{display:flex; flex-wrap:wrap; gap:9px}
.kfact{background:#fff; border:1px solid var(--line); border-radius:8px; padding:8px 12px;
  font-size:12px}
.kfact b{display:block; font-size:15px; font-variant-numeric:tabular-nums}
#modal .qa{border:1px solid var(--line); border-radius:9px; margin-bottom:10px;
  background:#fff; overflow:hidden}
#modal .qa>summary{cursor:pointer; padding:11px 13px; font-weight:600; font-size:13px;
  list-style:none; display:flex; gap:8px; align-items:baseline}
#modal .qa>summary::-webkit-details-marker{display:none}
#modal .qa>summary::before{content:"?"; color:var(--accent); font-weight:700}
#modal .qa[open]>summary{border-bottom:1px solid var(--line); background:#f7f3ea}
#modal .qa .body{padding:12px 13px}
#modal .qa .body p{margin:0 0 9px; font-size:13px}
#modal .qa .ev{margin-top:10px; padding-top:9px; border-top:1px dashed var(--line);
  font-size:11.5px; color:var(--dim)}
table.ass{width:100%; border-collapse:collapse; font-size:12.5px}
table.ass td{border-bottom:1px solid var(--line); padding:6px 7px; vertical-align:top}
table.ass td.id{font-weight:600; white-space:nowrap; width:1%}
#modal .tag{font-size:10px; text-transform:uppercase; letter-spacing:.04em; padding:1px 6px;
  border-radius:999px; background:#efe9dc; color:var(--dim)}
#modal .tag.assumed{background:#fdf0dc; color:#8a5a12}
#modal .caveat{background:#fbe3e2; border:1px solid var(--warn); color:#8d1c18;
  border-radius:8px; padding:11px 13px; margin-top:18px; font-size:12.5px}
#modal .close{float:right; font:inherit; border:1px solid var(--line); background:#fff;
  border-radius:6px; padding:5px 13px; cursor:pointer; color:inherit}
@media (max-width:820px){
  body{grid-template-columns:1fr; grid-template-rows:auto 6px 1fr}
  #grip{display:none}
  aside{border-right:0; border-bottom:1px solid var(--line); max-height:46vh}
}
</style>
</head>
<body>

<aside id="side">
  <h1>Growth and sensor placement</h1>
  <p class="sub">Where does new development use up the network's headroom, and where would
  a sensor notice?</p>

  <label class="fld" for="site">New dwellings connect at</label>
  <select id="site"></select>

  <div id="siteFacts"></div>
  <div id="tipList"></div>
  <div id="baseNote"></div>
  <div id="sensorList"></div>
</aside>

<div id="grip" title="Drag to resize"></div>

<main>
  <nav>
    <button id="fitAll">Whole catchment</button>
    <button id="fitSite">Zoom to the growth</button>
    <button id="toggleSensors">Show proposed sensors</button>
    <button id="btn-info" class="info">About this model</button>
  </nav>
  <div id="stage"></div>
  <div class="legend">
    <span><span class="k" style="background:#9aa3ad"></span>room to spare</span>
    <span><span class="k" style="background:#e8912d"></span>already surcharged, not caused by growth</span>
    <span><span class="k" style="background:#e0312b"></span>tipped by this growth</span>
    <span><span class="k" style="background:#2f7fd1"></span>where the houses go</span>
    <span><span class="k" style="background:#1f6f3f"></span>proposed sensor</span>
  </div>
  <div id="scale"></div>
</main>

<div id="modal" hidden><div class="box" id="modalBox"></div></div>

<script src="data/catchment.js"></script>
<script src="data/growth.js"></script>
<script src="data/index.js"></script>
<script src="growth_3d.js"></script>
<script src="growth_ui.js"></script>
<script type="module">
  GrowthUI.init();
</script>
</body>
</html>
