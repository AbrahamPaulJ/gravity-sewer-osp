<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sim 4 Sensor Story</title>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<style>
/* From the 6 Nov feedback: the map alone, with one small card for the step, and a popup on click.
   What sits behind each step (assumptions, sources, limits, next steps, the tables) folds out of the card; every
   control lives in Explore. Same dark ground and map colours as the earlier sims. */
:root{
  --bg:#0d1117; --panel:#111c2fee; --panel-solid:#111c2f; --ink:#e7edf7; --dim:#a9b8d4; --faint:#6f81a3;
  --line:#22314d; --accent:#38bdf8; --green:#2ef56b;
}
*{box-sizing:border-box}
html,body{margin:0; height:100%; overflow:hidden}
body{background:var(--bg); color:var(--ink); font:14px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
[hidden]{display:none !important}
#stage{position:fixed; inset:0}
#stage canvas{display:block; width:100%; height:100%}

/* What the map code expects */
.labels{position:absolute; inset:0; pointer-events:none; overflow:hidden}
.pipeCard{display:none !important}
.labels .lbl{position:absolute; transform:translate(-50%,-165%); white-space:nowrap; font-size:11px;
  font-weight:600; color:#c9a3ff; text-shadow:0 0 4px #0d1117, 0 0 4px #0d1117}
.labels .lbl.site{color:#7dd8ff; transform:translate(-50%, 42%)}
.labels .lbl.pump{color:#e3b341; transform:translate(-50%,-230%)}
.labels .lbl.scn{color:#00d4ff; transform:translate(-50%,-200%)}
.labels .lbl.spill{color:#ff3df5; font-weight:600; transform:translate(-50%,-210%)}
.labels .lbl.sensor{color:#04140a; background:#2ef56b; font-weight:700; font-size:11.5px;
  padding:1px 6px; border-radius:4px; transform:translate(-50%,-140%); box-shadow:0 0 0 2px #0d1117; z-index:3}
.labels .lbl.sensor.sel{font-size:15px; padding:2px 9px; z-index:6}
.labels .lbl.pumprate{color:#e3b341; font-weight:600; transform:translate(-50%,160%)}
.labels .lbl.scale,.labels .lbl.outlet{display:none !important}
.labels .lbl.region{color:#04140a; font-size:11px; font-weight:700; padding:1px 7px; border-radius:99px;
  transform:translate(-50%,-50%); text-shadow:none; box-shadow:0 0 0 2px #0d1117; opacity:.95}

/* The one card: wide and flat, so it covers as little of the map as it can. The header row (step, title, Back and Next,
   Hide) is all that stays when the reader folds it; the map shifts down by half the card's height so it centres in the
   space below (sim4_story.js sets --map-shift). The right 112px are kept clear for Explore. A tall card (its fold
   open) scrolls inside itself rather than running off the screen. */
#card{--cw:min(900px, calc(100vw - 128px)); position:fixed; top:16px; width:var(--cw); z-index:10;
  left:clamp(16px, calc((100vw - var(--cw)) / 2), calc(100vw - 112px - var(--cw)));
  max-height:calc(100vh - 32px); max-height:calc(100dvh - 32px); overflow-y:auto; overscroll-behavior:contain;
  background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:9px 12px 10px 16px; backdrop-filter:blur(6px);
  container-type:inline-size}
#card.in{animation:rise .32s ease-out}
@keyframes rise{from{opacity:.25; transform:translateY(-6px)} to{opacity:1; transform:none}}
#cardHead{display:flex; align-items:center; gap:6px 12px}
#stepN{flex:none; color:var(--faint); font-size:12px; white-space:nowrap}
#stepTitle{flex:1 1 auto; min-width:0; margin:0; font-size:19px; font-weight:650; line-height:1.25}
#nav{flex:none; display:flex; align-items:center; gap:8px}
#nav button{padding:4px 14px}
#dots{display:flex; gap:6px; margin-right:6px}
#dots i{width:8px; height:8px; border-radius:50%; background:var(--line)}
#dots i.on{background:var(--accent)}
#btnFold{flex:none; display:inline-flex; align-items:center; gap:5px; font-size:12.5px; padding:4px 9px; color:var(--dim); background:transparent}
#btnFold:hover{color:var(--ink)}
#btnFold svg{width:12px; height:12px; transition:transform .2s}
#btnFold[aria-expanded="false"] svg{transform:rotate(180deg)}
#cardMore{margin-top:5px; padding-right:4px}
#bodyRow{margin:0; font-size:15px; line-height:1.42}
#stepBody{display:inline; margin:0; font-size:15px; line-height:1.42; color:var(--ink)}
/* Slider, its label, the legend and the Regions button share one row, and wrap only when there is no room. */
#controls{display:flex; flex-wrap:wrap; align-items:center; gap:6px 20px; margin-top:7px}
#controls:has(#sliderRow[hidden]):has(#legend:empty):has(#btnRegions[hidden]){display:none}
#sliderRow{flex:1 1 330px; display:flex; align-items:center; gap:10px; min-width:0}
#sliderRow input{flex:1 1 120px; min-width:100px; accent-color:#fff176; margin:0}
#homesOut{flex:none; font-size:12.5px; color:var(--dim); white-space:nowrap}
#legendRow{flex:1 1 auto; display:flex; align-items:center; gap:10px}
#legendRow:has(#legend:empty):has(#btnRegions[hidden]){display:none}
#legend{display:flex; flex-wrap:wrap; gap:4px 12px; flex:1; font-size:12px; color:var(--dim)}
#btnRegions{flex:none; margin-left:auto; font-size:12px; padding:2px 10px; color:var(--dim)}
#btnRegions[aria-pressed="true"]{background:#0e4f6e; border-color:#16709b; color:var(--ink)}
#legend span{display:inline-flex; align-items:center; gap:6px; white-space:nowrap}
#legend i{width:10px; height:10px; border-radius:50%; flex:none}
/* A narrower card drops the dots (the step number says the same), then puts the title on its own line. */
@container (max-width:780px){#dots{display:none}}
@container (max-width:600px){#cardHead{flex-wrap:wrap} #stepTitle{order:5; flex-basis:100%} #stepN{flex:1}}
#stage{transform:translateY(var(--map-shift, 0px))}
body[data-ready] #stage{transition:transform .3s ease}
button{font:inherit; color:var(--ink); background:#1b2b47; border:1px solid var(--line); border-radius:8px; padding:6px 16px; cursor:pointer}
button:hover:not(:disabled){border-color:var(--accent)}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
button:disabled{opacity:.35; cursor:default}
#next{background:#0e4f6e; border-color:#16709b}

#btnExplore{position:fixed; top:16px; right:16px; z-index:12; background:var(--panel); font-size:13px; padding:5px 12px; color:var(--dim);
  border:1px solid var(--line); border-radius:8px; text-decoration:none; line-height:1.5}
#btnExplore:hover{color:var(--ink)}

/* The popup */
#pop{position:fixed; z-index:11; width:310px; background:var(--panel-solid); border:1px solid #2e4470; border-radius:10px; padding:11px 14px;
  font-size:13px; line-height:1.4; box-shadow:0 8px 28px #0009}
#pop b{display:block; font-size:14px; margin-bottom:6px}
#pop dl{margin:0; display:grid; grid-template-columns:auto 1fr; gap:4px 10px}
#pop dt{color:var(--faint); white-space:nowrap}
#pop dd{margin:0}
#pop p{margin:8px 0 0; color:var(--dim); font-size:12.5px}

/* "Behind this step": its button ends the card text, on the text's last line, so the card is no taller for it. The fold
   opens under the card's controls, closed by default: four short rows, the tables behind the step in a second fold, and
   one link to the redo guide. It scrolls inside itself, so an open fold covers no more map than it must. */
#notesBar{display:inline-block; margin-left:6px; white-space:nowrap; vertical-align:baseline}
#btnNotes{display:inline-flex; align-items:center; gap:5px; font-size:12px; line-height:16px; padding:1px 8px; color:var(--dim); background:transparent; vertical-align:baseline}
#btnNotes:hover{color:var(--ink)}
#btnNotes svg{width:11px; height:11px; transition:transform .2s}
#btnNotes[aria-expanded="true"]{color:var(--ink); border-color:#16709b}
#btnNotes[aria-expanded="true"] svg{transform:rotate(180deg)}
#notes{margin-top:6px; padding:8px 10px 9px; border:1px solid var(--line); border-radius:9px; background:#0b1424;
  max-height:min(46vh, 460px); overflow-y:auto; overscroll-behavior:contain}
#notes dl{margin:0; display:grid; grid-template-columns:max-content minmax(0, 1fr); gap:5px 12px; font-size:13px; line-height:1.42}
#notes dt{color:var(--faint); font-weight:600}
#notes dd{margin:0; color:var(--ink); min-width:0}
#notes details{margin-top:9px; font-size:12.5px}
#notes summary{cursor:pointer; color:var(--dim)}
#notes summary:hover{color:var(--ink)}
#notes h3{font-size:13px; margin:10px 0 2px}
#notes .fig p{margin:0 0 4px; color:var(--dim)}
#notes .tscroll{overflow-x:auto; max-width:100%}
#notes table{border-collapse:collapse; width:100%; font-size:12px}
#notes th{color:var(--faint); text-align:left; font-weight:600; border-bottom:1px solid var(--line); padding:3px 8px 3px 0; vertical-align:bottom}
#notes td{border-bottom:1px solid #1a2840; padding:3px 8px 3px 0; vertical-align:top}
#notes .redo{display:inline-block; margin-top:9px; font-size:13px; color:var(--accent)}
@media (prefers-reduced-motion:reduce){#card.in{animation:none} body[data-ready] #stage{transition:none} #btnFold svg,#btnNotes svg{transition:none}}
@media (max-width:640px){#card{--cw:calc(100vw - 16px); left:8px; top:8px; padding:8px 10px 9px 12px} #bodyRow,#stepBody{font-size:14px} #stepTitle{font-size:17px} #btnExplore{top:auto; bottom:16px} #notes{max-height:38vh} #notes dl{grid-template-columns:1fr; gap:0 0} #notes dd{margin-bottom:6px} #pop{width:min(310px, calc(100vw - 24px))}}
</style>
</head>
<body>
<div id="stage" aria-label="Map of the sewer network"></div>

<section id="card" aria-live="polite">
  <div id="cardHead">
    <div id="stepN"></div>
    <h1 id="stepTitle"></h1>
    <div id="nav">
      <div id="dots" aria-hidden="true"></div>
      <button id="back" type="button">Back</button>
      <button id="next" type="button">Next</button>
    </div>
    <button id="btnFold" type="button" aria-expanded="true" aria-controls="cardMore" aria-label="Hide step details" title="Hide the step's text and controls, to see more of the map"><span>Hide</span><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 8l4-4 4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </div>
  <div id="cardMore">
    <div id="bodyRow"><p id="stepBody"></p> <span id="notesBar"><button id="btnNotes" type="button" aria-expanded="false" aria-controls="notes" title="What this step assumes, its sources, its limits and what comes next">Behind this step<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 4l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button></span></div>
    <div id="controls">
      <div id="sliderRow" hidden>
        <input id="homes" type="range" min="0" max="5" step="1" value="5" aria-label="Share of each region's 2041 homes">
        <output id="homesOut" for="homes"></output>
      </div>
      <div id="legendRow">
        <div id="legend"></div>
        <button id="btnRegions" type="button" aria-pressed="false" title="Show each region in its own colour, without the surcharge colours" hidden>Regions</button>
      </div>
    </div>
    <div id="notes" hidden></div>
  </div>
</section>

<div id="pop" hidden></div>

<a id="btnExplore" href="explore.html" title="Every weather case, rule, region and sensor method on these regions, in Sim 3.5's full view">Explore</a>

<script src="../simulation3/data/catchment.js?v=9"></script>
<script src="../simulation3/data/growth.js?v=9"></script>
<script src="data/regions.js?v=1"></script>
<script src="../simulation3/data/index.js?v=9"></script>
<script src="../simulation35/growth_3d.js?v=3"></script>
<script src="data/sim4.js?v=7"></script>
<script src="sim4_story.js?v=6"></script>
<script type="module">
  Sim4.init();
</script>
</body>
</html>
