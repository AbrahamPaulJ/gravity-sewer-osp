<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sim 4 Sensor Story</title>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<style>
/* From the 6 Nov feedback: the map alone, with one small card for the step, and a popup on click.
   Everything else sits behind Expert. Same dark ground and map colours as the earlier sims. */
:root{
  --bg:#0d1117; --panel:#111c2fee; --panel-solid:#111c2f; --ink:#e7edf7; --dim:#a9b8d4; --faint:#6f81a3;
  --line:#22314d; --accent:#38bdf8; --green:#2ef56b;
}
*{box-sizing:border-box}
html,body{margin:0; height:100%; overflow:hidden}
body{background:var(--bg); color:var(--ink); font:14px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
[hidden]{display:none !important}
#stage{position:fixed; inset:0}
#stage canvas{display:block; width:100%; height:100%}

/* What the map code expects */
.labels{position:absolute; inset:0; pointer-events:none; overflow:hidden}
.pipeCard{display:none !important}
.labels .lbl{position:absolute; transform:translate(-50%,-165%); white-space:nowrap; font-size:11px;
  font-weight:600; color:#c9a3ff; text-shadow:0 0 4px #0d1117, 0 0 4px #0d1117}
.labels .lbl.site{color:#7dd8ff; transform:translate(-50%, 42%)}
.labels .lbl.pump{color:#e3b341; transform:translate(-50%,-230%)}
.labels .lbl.scn{color:#00d4ff; transform:translate(-50%,-200%)}
.labels .lbl.spill{color:#ff3df5; font-weight:600; transform:translate(-50%,-210%)}
.labels .lbl.sensor{color:#04140a; background:#2ef56b; font-weight:700; font-size:11.5px;
  padding:1px 6px; border-radius:4px; transform:translate(-50%,-140%); box-shadow:0 0 0 2px #0d1117; z-index:3}
.labels .lbl.sensor.sel{font-size:15px; padding:2px 9px; z-index:6}
.labels .lbl.pumprate{color:#e3b341; font-weight:600; transform:translate(-50%,160%)}
.labels .lbl.scale,.labels .lbl.outlet{display:none !important}
.labels .lbl.region{color:#04140a; font-size:11px; font-weight:700; padding:1px 7px; border-radius:99px;
  transform:translate(-50%,-50%); text-shadow:none; box-shadow:0 0 0 2px #0d1117; opacity:.95}

/* The one card */
#card{position:fixed; top:16px; left:50%; transform:translate(-50%,0); width:min(620px, calc(100vw - 32px)); z-index:10;
  background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px 18px 12px; backdrop-filter:blur(6px)}
#card.in{animation:rise .32s ease-out}
@keyframes rise{from{opacity:.25; transform:translate(-50%,-6px)} to{opacity:1; transform:translate(-50%,0)}}
#stepN{color:var(--faint); font-size:12px}
#stepTitle{margin:0 0 4px; font-size:19px; font-weight:650; line-height:1.25}
#stepBody{margin:0; font-size:15px; line-height:1.45; color:var(--ink)}
#legendRow{display:flex; align-items:center; gap:10px; margin-top:8px}
#legendRow:has(#legend:empty):has(#btnRegions[hidden]){display:none}
#legend{display:flex; flex-wrap:wrap; gap:4px 14px; flex:1; font-size:12px; color:var(--dim)}
#btnRegions{flex:none; font-size:12px; padding:2px 10px; color:var(--dim)}
#btnRegions[aria-pressed="true"]{background:#0e4f6e; border-color:#16709b; color:var(--ink)}
#legend span{display:inline-flex; align-items:center; gap:6px}
#legend i{width:10px; height:10px; border-radius:50%; flex:none}
#sliderRow{margin-top:10px}
#sliderRow input{width:100%; accent-color:#fff176; margin:0}
#homesOut{display:block; font-size:12.5px; color:var(--dim)}
#nav{display:flex; align-items:center; gap:10px; margin-top:10px}
#dots{display:flex; gap:6px; flex:1}
#dots i{width:8px; height:8px; border-radius:50%; background:var(--line)}
#dots i.on{background:var(--accent)}
button{font:inherit; color:var(--ink); background:#1b2b47; border:1px solid var(--line); border-radius:8px; padding:6px 16px; cursor:pointer}
button:hover:not(:disabled){border-color:var(--accent)}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
button:disabled{opacity:.35; cursor:default}
#next{background:#0e4f6e; border-color:#16709b}

#btnExpert{position:fixed; top:16px; right:16px; z-index:12; background:var(--panel); font-size:13px; padding:5px 12px; color:var(--dim)}
#btnExplore{position:fixed; top:16px; right:96px; z-index:12; background:var(--panel); font-size:13px; padding:5px 12px; color:var(--dim);
  border:1px solid var(--line); border-radius:8px; text-decoration:none; line-height:1.5}
#btnExplore:hover{color:var(--ink)}
body.expert-on #btnExplore{display:none}     /* Expert takes the map over, and its wider Close button sits here */

/* The popup */
#pop{position:fixed; z-index:11; width:310px; background:var(--panel-solid); border:1px solid #2e4470; border-radius:10px; padding:11px 14px;
  font-size:13px; line-height:1.4; box-shadow:0 8px 28px #0009}
#pop b{display:block; font-size:14px; margin-bottom:6px}
#pop dl{margin:0; display:grid; grid-template-columns:auto 1fr; gap:4px 10px}
#pop dt{color:var(--faint); white-space:nowrap}
#pop dd{margin:0}
#pop p{margin:8px 0 0; color:var(--dim); font-size:12.5px}

/* Expert keeps the left-panel rule: a narrow panel beside the live map for Play, wide for Tables and Limits */
#expert{position:fixed; top:0; left:0; bottom:0; width:min(390px, 100vw); z-index:20; background:var(--panel-solid); border-right:1px solid var(--line);
  overflow:auto; padding:0 18px 40px; box-shadow:8px 0 30px #0008}
#expert.wide{width:min(900px, 100vw)}
@media (min-width:641px){body.expert-on #stage{left:390px}}     /* the map moves over, so the panel hides none of it */
#expertHead{position:sticky; top:0; z-index:2; background:var(--panel-solid); padding:14px 0 0; margin-bottom:10px; border-bottom:1px solid var(--line)}
#expert h1{font-size:18px; margin:0 0 8px; display:inline-block}
#expertHead #expertClose{float:right; padding:4px 12px; font-size:13px}
.etabs{display:flex; gap:2px}
.etabs button{border:0; border-radius:6px 6px 0 0; background:transparent; color:var(--dim); padding:6px 14px; font-size:13.5px}
.etabs button.on{background:#1b2b47; color:var(--ink); box-shadow:inset 0 -2px 0 var(--accent)}
.play .lead{font-size:12.5px}
.play label{display:block; margin:12px 0 4px; color:var(--dim); font-size:12.5px}
.play label output{color:var(--ink); float:right}
.play select{width:100%; font:inherit; font-size:13px; color:var(--ink); background:#0f1a2d; border:1px solid var(--line); border-radius:6px; padding:5px 6px}
.play input[type=range]{width:100%; accent-color:#fff176; margin:0}
.seg{display:flex; margin-top:14px}
.seg button{flex:1; border-radius:0; padding:6px 6px; font-size:12.5px; background:#0f1a2d}
.seg button:first-child{border-radius:7px 0 0 7px}
.seg button:last-child{border-radius:0 7px 7px 0}
.seg button.on{background:#0e4f6e; border-color:#16709b}
#pResult{margin-top:14px; background:#0b1424; border:1px solid var(--line); border-radius:9px; padding:10px 12px; font-size:13px}
#pResult .big{font-size:21px; font-weight:650; line-height:1.2}
#pResult .sub{color:var(--dim); font-size:12.5px}
#pResult p{margin:6px 0 0; color:var(--dim); font-size:12.5px}
#pResult b{color:var(--ink)}
#pResult table{width:100%; border-collapse:collapse; font-size:12.5px; margin-top:4px}
#pResult th{color:var(--faint); font-weight:600; text-align:left; padding:3px 6px 3px 0; border-bottom:1px solid var(--line); vertical-align:bottom}
#pResult td{padding:3px 6px 3px 0; border-bottom:1px solid #1a2840; vertical-align:top}
#pResult td.on,#pResult th.on{color:#7dd8ff}
.plegend{display:flex; flex-wrap:wrap; gap:4px 12px; margin-top:10px; font-size:12px; color:var(--dim)}
.plegend span{display:inline-flex; align-items:center; gap:6px}
.plegend i{width:10px; height:10px; border-radius:50%; flex:none}
.labels .lbl.scn.float{color:#00d4ff; font-weight:700; font-size:11px}
#expert h2{font-size:14.5px; margin:22px 0 4px}
#expert p,#expert li{color:var(--dim); font-size:13px}
#expert p{margin:0 0 8px}
#expert ul{margin:4px 0 0; padding-left:18px}
#expert a{color:var(--accent)}
#expert table{border-collapse:collapse; width:100%; font-size:12.5px; margin-top:4px}
#expert th{color:var(--faint); text-align:left; font-weight:600; border-bottom:1px solid var(--line); padding:4px 8px 4px 0; vertical-align:bottom}
#expert td{border-bottom:1px solid #1a2840; padding:4px 8px 4px 0; vertical-align:top}
@media (prefers-reduced-motion:reduce){#card.in{animation:none}}
@media (max-width:640px){#stepBody{font-size:14px} #stepTitle{font-size:17px} #btnExpert{top:auto; bottom:16px} #btnExplore{top:auto; bottom:16px} #pop{width:min(310px, calc(100vw - 24px))}}
</style>
</head>
<body>
<div id="stage" aria-label="Map of the sewer network"></div>

<section id="card" aria-live="polite">
  <div id="stepN"></div>
  <h1 id="stepTitle"></h1>
  <p id="stepBody"></p>
  <div id="sliderRow" hidden>
    <input id="homes" type="range" min="0" max="5" step="1" value="5" aria-label="Share of each region's 2041 homes">
    <output id="homesOut" for="homes"></output>
  </div>
  <div id="legendRow">
    <div id="legend"></div>
    <button id="btnRegions" type="button" aria-pressed="false" title="Show each region in its own colour, without the surcharge colours" hidden>Regions</button>
  </div>
  <div id="nav">
    <div id="dots" aria-hidden="true"></div>
    <button id="back" type="button">Back</button>
    <button id="next" type="button">Next</button>
  </div>
</section>

<div id="pop" hidden></div>

<a id="btnExplore" href="explore.html" title="Every weather case, rule, region and sensor method on these regions, in Sim 3.5's full view">Explore</a>
<button id="btnExpert" type="button" aria-expanded="false" aria-controls="expert">Expert</button>
<aside id="expert" hidden>
  <div id="expertHead">
    <h1>Expert</h1>
    <button id="expertClose" type="button">Close</button>
    <nav class="etabs" role="tablist">
      <button type="button" role="tab" data-pane="play" class="on">Play</button>
      <button type="button" role="tab" data-pane="tables">Tables</button>
      <button type="button" role="tab" data-pane="limits">Limits</button>
    </nav>
  </div>
  <section id="pane-play" class="epane play">
    <p class="lead">Try the sensor list on any weather, region and share of homes. Every figure is an uncalibrated model result, worked out here from the same runs as the story.</p>
    <label for="pWeather">Weather</label>
    <select id="pWeather"></select>
    <label for="pRegion">Region</label>
    <select id="pRegion"></select>
    <label for="pHomes">Homes built <output id="pHomesOut" for="pHomes"></output></label>
    <input id="pHomes" type="range" min="1" max="5" step="1" value="5">
    <div class="seg" id="pKind" role="group" aria-label="What to compare">
      <button type="button" data-kind="level" class="on">Level sensors</button>
      <button type="button" data-kind="float">Level or float, same money</button>
    </div>
    <label for="pK" id="pKLabel">Sensors <output id="pKOut" for="pK"></output></label>
    <input id="pK" type="range" min="1" max="8" step="1" value="5">
    <div class="seg" id="pShow" role="group" aria-label="Set shown on the map" hidden>
      <button type="button" data-show="level" class="on">Level, the list</button>
      <button type="button" data-show="float">Floats only</button>
      <button type="button" data-show="mix">Free mix</button>
    </div>
    <div id="pResult" aria-live="polite"></div>
    <div id="pLegend" class="plegend"></div>
  </section>
  <section id="pane-tables" class="epane" hidden>
    <p>The figures behind the story. Everything is an uncalibrated model result.</p>
    <div id="expertTables"></div>
  </section>
  <section id="pane-limits" class="epane" hidden><div id="expertLimits"></div></section>
</aside>

<script src="../simulation3/data/catchment.js?v=9"></script>
<script src="../simulation3/data/growth.js?v=9"></script>
<script src="data/regions.js?v=1"></script>
<script src="../simulation3/data/index.js?v=9"></script>
<script src="../simulation35/growth_3d.js?v=3"></script>
<script src="data/sim4.js?v=6"></script>
<script src="sim4_story.js?v=4"></script>
<script src="sim4_play.js?v=3"></script>
<script type="module">
  Sim4.init();
</script>
</body>
</html>
